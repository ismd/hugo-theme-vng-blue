<header class="vg-header{{ if .IsHome }} vg-header_home{{ end }}">
  <div class="vg-header__logo">
    <a href="{{ .Site.BaseURL }}">
      {{ with resources.Get "logo.png" }}
      {{ $1x := .Resize (printf "%dx webp q90" (div .Width 2)) }}
      {{ $2x := .Resize (printf "%dx webp q90" .Width) }}
      <img src="{{ $1x.RelPermalink }}"
           srcset="{{ $2x.RelPermalink }} 2x"
           alt="{{ $.Site.Title }}"
           aria-label="{{ $.Site.Title }}" />
      {{ end }}
    </a>
  </div>

  {{ partial "menu.html" (dict "menuID" "main" "page" .) }}

  {{ partial "theme-switcher.html" (dict "context" "header" "page" .) }}

  <a href="javascript:void();" class="vg-hamburger" aria-label="Toggle menu" aria-controls="main-menu" aria-expanded="false">
    <div class="vg-hamburger__box">
      <div class="vg-hamburger__line"></div>
      <div class="vg-hamburger__line"></div>
      <div class="vg-hamburger__line"></div>
    </div>
  </a>
</header>
